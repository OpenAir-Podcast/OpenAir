# Template manifest for flatpak-flutter (https://github.com/TheAppgineer/flatpak-flutter).
#
# This is NOT directly consumable by flatpak-builder: Flutter apps cannot resolve
# their pub.dev dependencies inside the sandboxed, network-less Flathub build.
# Run flatpak-flutter on this file to produce the offline manifest
# (`io.github.openair_podcast.openair.yml`) plus `pubspec-sources.json`.
#
# See flatpak/README.md for the exact commands.

app-id: io.github.openair_podcast.openair
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

# Flutter 3.44's linux build hardcodes CC/CXX to clang/clang++ (see
# flutter_tools/lib/src/linux/build_linux.dart). The GNOME SDK does not ship
# clang, so provide LLVM through the freedesktop sdk-extension (same approach
# GNOME Builder uses). Installed automatically by Flatpak mirrors/CI.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm19

command: OpenAir

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Notification
  - --system-talk-name=org.freedesktop.NetworkManager

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: OpenAir
    buildsystem: simple
    build-options:
      append-path: /var/lib/flutter/bin:/usr/lib/sdk/llvm19/bin
      env:
        PUB_CACHE: /run/build/OpenAir/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - install -Dm755 build/linux/x64/release/bundle/OpenAir /app/bin/OpenAir
      - cp -r build/linux/x64/release/bundle/data /app/bin/data
      - cp -r build/linux/x64/release/bundle/lib /app/bin/lib
      - install -Dm644 io.github.openair_podcast.openair.desktop /app/share/applications/io.github.openair_podcast.openair.desktop
      - install -Dm644 io.github.openair_podcast.openair.metainfo.xml /app/share/metainfo/io.github.openair_podcast.openair.metainfo.xml
      - install -Dm644 io.github.openair_podcast.openair.png /app/share/icons/hicolor/512x512/apps/io.github.openair_podcast.openair.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.openair_podcast.openair/LICENSE
    sources:
      - type: git
        url: https://github.com/OpenAir-Podcast/OpenAir.git
      - type: file
        path: io.github.openair_podcast.openair.desktop
      - type: file
        path: io.github.openair_podcast.openair.metainfo.xml
      - type: file
        path: io.github.openair_podcast.openair.png
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.44.4
        dest: flutter

# Template manifest for flatpak-flutter (https://github.com/TheAppgineer/flatpak-flutter).
#
# This is NOT directly consumable by flatpak-builder: Flutter apps cannot resolve
# their pub.dev dependencies inside the sandboxed, network-less Flathub build.
# Run flatpak-flutter on this file to produce the offline manifest
# (`com.openair.podcast.yml`) plus `pubspec-sources.json`.
#
# See flatpak/README.md for the exact commands.

app-id: com.openair.podcast
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: OpenAir

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: OpenAir
    buildsystem: simple
    build-commands:
      - flutter build linux --release --no-pub
      - install -Dm755 build/linux/x64/release/bundle/OpenAir /app/bin/OpenAir
      - cp -r build/linux/x64/release/bundle/data /app/bin/data
      - cp -r build/linux/x64/release/bundle/lib /app/bin/lib
      - install -Dm644 com.openair.podcast.desktop /app/share/applications/com.openair.podcast.desktop
      - install -Dm644 com.openair.podcast.metainfo.xml /app/share/metainfo/com.openair.podcast.metainfo.xml
      - install -Dm644 com.openair.podcast.png /app/share/icons/hicolor/512x512/apps/com.openair.podcast.png
    sources:
      - type: git
        url: https://github.com/OpenAir-Podcast/OpenAir.git
      - type: file
        path: com.openair.podcast.desktop
      - type: file
        path: com.openair.podcast.metainfo.xml
      - type: file
        path: com.openair.podcast.png
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.44.4
        dest: flutter

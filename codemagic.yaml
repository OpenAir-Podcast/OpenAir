workflows:
  flutter-android-debug:
    name: Flutter Android (Debug)
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create .env
        script: |
          cat > .env <<EOF
          PODCAST_INDEX_API_KEY=${PODCAST_INDEX_API_KEY:-dummy}
          PODCAST_INDEX_API_SECRET=${PODCAST_INDEX_API_SECRET:-dummy}
          PODCAST_USER_AGENT=${PODCAST_USER_AGENT:-OpenAir/1.0}
          FYYD_ACCESS_TOKEN=${FYYD_ACCESS_TOKEN:-dummy}
          PAYPAL_URL=${PAYPAL_URL:-https://example.com}
          DONATE_WITH_KOFI_URL=${DONATE_WITH_KOFI_URL:-https://example.com}
          DISCORD_URL=${DISCORD_URL:-https://example.com}
          URL_GITHUB_ISSUES=${URL_GITHUB_ISSUES:-https://example.com}
          URL_GITHUB_DISCUSSION=${URL_GITHUB_DISCUSSION:-https://example.com}
          URL_GITHUB=${URL_GITHUB:-https://example.com}
          PRIVACY_POLICY=${PRIVACY_POLICY:-https://example.com}
          TERMS_OF_SERVICE=${TERMS_OF_SERVICE:-https://example.com}
          EOF
      - name: Generate code
        script: dart run build_runner build
      - name: Run tests
        script: flutter test
      - name: Build Android APK (debug)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/**/*.apk

  flutter-android-release:
    name: Flutter Android (Release)
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create .env
        script: |
          cat > .env <<EOF
          PODCAST_INDEX_API_KEY=${PODCAST_INDEX_API_KEY:-dummy}
          PODCAST_INDEX_API_SECRET=${PODCAST_INDEX_API_SECRET:-dummy}
          PODCAST_USER_AGENT=${PODCAST_USER_AGENT:-OpenAir/1.0}
          FYYD_ACCESS_TOKEN=${FYYD_ACCESS_TOKEN:-dummy}
          PAYPAL_URL=${PAYPAL_URL:-https://example.com}
          DONATE_WITH_KOFI_URL=${DONATE_WITH_KOFI_URL:-https://example.com}
          DISCORD_URL=${DISCORD_URL:-https://example.com}
          URL_GITHUB_ISSUES=${URL_GITHUB_ISSUES:-https://example.com}
          URL_GITHUB_DISCUSSION=${URL_GITHUB_DISCUSSION:-https://example.com}
          URL_GITHUB=${URL_GITHUB:-https://example.com}
          PRIVACY_POLICY=${PRIVACY_POLICY:-https://example.com}
          TERMS_OF_SERVICE=${TERMS_OF_SERVICE:-https://example.com}
          EOF
      - name: Generate code
        script: dart run build_runner build
      - name: Set up Android signing
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            echo "storeFile=$CM_KEYSTORE_PATH" > android/key.properties
            echo "storePassword=$CM_KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          else
            echo "No keystore configured; building with debug signing"
            rm -f android/key.properties
          fi
      - name: Build Android AAB (release)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk

  flutter-ios:
    name: Flutter iOS
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create .env
        script: |
          cat > .env <<EOF
          PODCAST_INDEX_API_KEY=${PODCAST_INDEX_API_KEY:-dummy}
          PODCAST_INDEX_API_SECRET=${PODCAST_INDEX_API_SECRET:-dummy}
          PODCAST_USER_AGENT=${PODCAST_USER_AGENT:-OpenAir/1.0}
          FYYD_ACCESS_TOKEN=${FYYD_ACCESS_TOKEN:-dummy}
          PAYPAL_URL=${PAYPAL_URL:-https://example.com}
          DONATE_WITH_KOFI_URL=${DONATE_WITH_KOFI_URL:-https://example.com}
          DISCORD_URL=${DISCORD_URL:-https://example.com}
          URL_GITHUB_ISSUES=${URL_GITHUB_ISSUES:-https://example.com}
          URL_GITHUB_DISCUSSION=${URL_GITHUB_DISCUSSION:-https://example.com}
          URL_GITHUB=${URL_GITHUB:-https://example.com}
          PRIVACY_POLICY=${PRIVACY_POLICY:-https://example.com}
          TERMS_OF_SERVICE=${TERMS_OF_SERVICE:-https://example.com}
          EOF
      - name: Generate code
        script: dart run build_runner build
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build iOS
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa

  flutter-web:
    name: Flutter Web
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create .env
        script: |
          cat > .env <<EOF
          PODCAST_INDEX_API_KEY=${PODCAST_INDEX_API_KEY:-dummy}
          PODCAST_INDEX_API_SECRET=${PODCAST_INDEX_API_SECRET:-dummy}
          PODCAST_USER_AGENT=${PODCAST_USER_AGENT:-OpenAir/1.0}
          FYYD_ACCESS_TOKEN=${FYYD_ACCESS_TOKEN:-dummy}
          PAYPAL_URL=${PAYPAL_URL:-https://example.com}
          DONATE_WITH_KOFI_URL=${DONATE_WITH_KOFI_URL:-https://example.com}
          DISCORD_URL=${DISCORD_URL:-https://example.com}
          URL_GITHUB_ISSUES=${URL_GITHUB_ISSUES:-https://example.com}
          URL_GITHUB_DISCUSSION=${URL_GITHUB_DISCUSSION:-https://example.com}
          URL_GITHUB=${URL_GITHUB:-https://example.com}
          PRIVACY_POLICY=${PRIVACY_POLICY:-https://example.com}
          TERMS_OF_SERVICE=${TERMS_OF_SERVICE:-https://example.com}
          EOF
      - name: Generate code
        script: dart run build_runner build
      - name: Build Web
        script: flutter build web --release
    artifacts:
      - build/web/**
name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          @"
          PODCAST_INDEX_API_KEY=dummy
          PODCAST_INDEX_API_SECRET=dummy
          PODCAST_USER_AGENT=OpenAir/1.0
          FYYD_ACCESS_TOKEN=dummy
          PAYPAL_URL=https://example.com
          DONATE_WITH_KOFI_URL=https://example.com
          DISCORD_URL=https://example.com
          URL_GITHUB_ISSUES=https://example.com
          URL_GITHUB_DISCUSSION=https://example.com
          URL_GITHUB=https://example.com
          PRIVACY_POLICY=https://example.com
          TERMS_OF_SERVICE=https://example.com
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Generate code
        run: dart run build_runner build

      - name: Build Windows EXE
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --release

      - name: Build MSIX
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter pub run msix:create

      - name: Build MSI (flutter_distributor)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          dart pub global activate flutter_distributor
          flutter_distributor package --platform windows --targets msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/x64/runner/Release/
            build/windows/*.msix
            dist/*.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/x64/runner/Release/openair.exe
            build/windows/*.msix
            dist/*.msi
          draft: false
          prerelease: false
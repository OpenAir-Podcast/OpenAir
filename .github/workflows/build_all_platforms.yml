name: Flutter Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to (leave empty for nightly)"
        required: false
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            v="${{ inputs.release_tag }}"
          else
            v="nightly-${{ github.run_id }}"
          fi
          v="${v%"${v##*[![:space:]]}"}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        run: |
          if ! gh release view "${{ steps.version.outputs.version }}" &>/dev/null; then
            gh release create "${{ steps.version.outputs.version }}" \
              --title "OpenAir ${{ steps.version.outputs.version }}" \
              --notes-file CHANGELOG_SHORT.txt \
              --draft \
              --prerelease
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux_tarball:
    needs: create_release
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libjsoncpp-dev liblzma-dev ninja-build pkg-config
      - run: flutter pub get
      - name: Regenerate env.g.dart from secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          PODCAST_INDEX_API_KEY="${{ secrets.PODCAST_INDEX_API_KEY }}"
          PODCAST_INDEX_API_SECRET="${{ secrets.PODCAST_INDEX_API_SECRET }}"
          PODCAST_USER_AGENT="${{ secrets.PODCAST_USER_AGENT }}"
          FYYD_ACCESS_TOKEN="${{ secrets.FYYD_ACCESS_TOKEN }}"
          PAYPAL_URL="${{ secrets.PAYPAL_URL }}"
          DONATE_WITH_KOFI_URL="${{ secrets.DONATE_WITH_KOFI_URL }}"
          DISCORD_URL="${{ secrets.DISCORD_URL }}"
          URL_GITHUB_ISSUES="${{ secrets.URL_GITHUB_ISSUES }}"
          URL_GITHUB_DISCUSSION="${{ secrets.URL_GITHUB_DISCUSSION }}"
          PRIVACY_POLICY="${{ secrets.PRIVACY_POLICY }}"
          URL_GITHUB="${{ secrets.URL_GITHUB }}"
          TERMS_OF_SERVICE="${{ secrets.TERMS_OF_SERVICE }}"
          EOF
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Package
        run: |
          RELEASE_NAME="openair-${{ needs.create_release.outputs.version }}-linux-x64.tar.gz"
          cd build/linux/x64/release/bundle
          tar -czvf "../../../../../$RELEASE_NAME" .
      - name: Upload
        run: |
          gh release upload --clobber "${{ needs.create_release.outputs.version }}" \
            "openair-${{ needs.create_release.outputs.version }}-linux-x64.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_appimage:
    needs: create_release
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux Build & AppImage Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libjsoncpp-dev liblzma-dev ninja-build pkg-config curl file

          sudo curl -Lo /usr/local/bin/linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/linuxdeploy
          sudo curl -Lo /usr/local/bin/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool

      - run: flutter pub get
      - name: Regenerate env.g.dart from secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          PODCAST_INDEX_API_KEY="${{ secrets.PODCAST_INDEX_API_KEY }}"
          PODCAST_INDEX_API_SECRET="${{ secrets.PODCAST_INDEX_API_SECRET }}"
          PODCAST_USER_AGENT="${{ secrets.PODCAST_USER_AGENT }}"
          FYYD_ACCESS_TOKEN="${{ secrets.FYYD_ACCESS_TOKEN }}"
          PAYPAL_URL="${{ secrets.PAYPAL_URL }}"
          DONATE_WITH_KOFI_URL="${{ secrets.DONATE_WITH_KOFI_URL }}"
          DISCORD_URL="${{ secrets.DISCORD_URL }}"
          URL_GITHUB_ISSUES="${{ secrets.URL_GITHUB_ISSUES }}"
          URL_GITHUB_DISCUSSION="${{ secrets.URL_GITHUB_DISCUSSION }}"
          PRIVACY_POLICY="${{ secrets.PRIVACY_POLICY }}"
          URL_GITHUB="${{ secrets.URL_GITHUB }}"
          TERMS_OF_SERVICE="${{ secrets.TERMS_OF_SERVICE }}"
          EOF
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release

      - name: Bundle AppImage
        run: |
          mkdir -p AppDir
          cp -r build/linux/x64/release/bundle/* AppDir/

          install -Dm644 linux/io.github.openair_podcast.openair.desktop AppDir/openair.desktop
          install -Dm644 linux/app_icon.png AppDir/io.github.openair_podcast.openair.png

          export OUTPUT="openair-${{ needs.create_release.outputs.version }}-x86_64.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1
          linuxdeploy --appdir AppDir --output appimage

      - name: Upload AppImage
        run: |
          gh release upload --clobber "${{ needs.create_release.outputs.version }}" \
            openair-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    needs: create_release
    name: Windows (zip)
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'
      - run: flutter pub get
      - name: Regenerate env.g.dart from secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          PODCAST_INDEX_API_KEY="${{ secrets.PODCAST_INDEX_API_KEY }}"
          PODCAST_INDEX_API_SECRET="${{ secrets.PODCAST_INDEX_API_SECRET }}"
          PODCAST_USER_AGENT="${{ secrets.PODCAST_USER_AGENT }}"
          FYYD_ACCESS_TOKEN="${{ secrets.FYYD_ACCESS_TOKEN }}"
          PAYPAL_URL="${{ secrets.PAYPAL_URL }}"
          DONATE_WITH_KOFI_URL="${{ secrets.DONATE_WITH_KOFI_URL }}"
          DISCORD_URL="${{ secrets.DISCORD_URL }}"
          URL_GITHUB_ISSUES="${{ secrets.URL_GITHUB_ISSUES }}"
          URL_GITHUB_DISCUSSION="${{ secrets.URL_GITHUB_DISCUSSION }}"
          PRIVACY_POLICY="${{ secrets.PRIVACY_POLICY }}"
          URL_GITHUB="${{ secrets.URL_GITHUB }}"
          TERMS_OF_SERVICE="${{ secrets.TERMS_OF_SERVICE }}"
          EOF
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Sign binaries (optional)
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem -Path "build/windows/x64/runner/Release" -Recurse -Include *.exe,*.dll | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
      - name: Package
        shell: powershell
        run: |
          $V = "${{ needs.create_release.outputs.version }}"
          $ZipName = "openair-$V-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $ZipName
      - name: Upload
        shell: bash
        run: |
          gh release upload --clobber "${{ needs.create_release.outputs.version }}" \
            "openair-${{ needs.create_release.outputs.version }}-windows-x64.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos:
    needs: create_release
    name: macOS (dmg)
    runs-on: macos-latest
    # Optional code signing + notarization. Leave the secrets unset to ship an
    # unsigned (ad-hoc) build; set them all to ship a Gatekeeper-friendly one.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Regenerate env.g.dart from secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          PODCAST_INDEX_API_KEY="${{ secrets.PODCAST_INDEX_API_KEY }}"
          PODCAST_INDEX_API_SECRET="${{ secrets.PODCAST_INDEX_API_SECRET }}"
          PODCAST_USER_AGENT="${{ secrets.PODCAST_USER_AGENT }}"
          FYYD_ACCESS_TOKEN="${{ secrets.FYYD_ACCESS_TOKEN }}"
          PAYPAL_URL="${{ secrets.PAYPAL_URL }}"
          DONATE_WITH_KOFI_URL="${{ secrets.DONATE_WITH_KOFI_URL }}"
          DISCORD_URL="${{ secrets.DISCORD_URL }}"
          URL_GITHUB_ISSUES="${{ secrets.URL_GITHUB_ISSUES }}"
          URL_GITHUB_DISCUSSION="${{ secrets.URL_GITHUB_DISCUSSION }}"
          PRIVACY_POLICY="${{ secrets.PRIVACY_POLICY }}"
          URL_GITHUB="${{ secrets.URL_GITHUB }}"
          TERMS_OF_SERVICE="${{ secrets.TERMS_OF_SERVICE }}"
          EOF
          dart run build_runner build --delete-conflicting-outputs
      - name: Import signing certificate (optional)
        if: env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - run: flutter build macos --release
      - name: Sign .app (optional)
        if: env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          codesign --force --deep --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" \
            --entitlements macos/Runner/Release.entitlements \
            "build/macos/Build/Products/Release/OpenAir.app"
      - name: Package (.dmg)
        shell: bash
        run: |
          V="${{ needs.create_release.outputs.version }}"
          DMG="openair-$V-macos-arm64.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "build/macos/Build/Products/Release/OpenAir.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "OpenAir" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            codesign --force --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - name: Notarize (optional)
        if: env.APPLE_ID != ''
        shell: bash
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
      - name: Upload
        shell: bash
        run: |
          gh release upload --clobber "${{ needs.create_release.outputs.version }}" "$DMG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_android:
    needs: create_release
    name: Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup keystore
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: flutter pub get
      - name: Regenerate env.g.dart from secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          PODCAST_INDEX_API_KEY="${{ secrets.PODCAST_INDEX_API_KEY }}"
          PODCAST_INDEX_API_SECRET="${{ secrets.PODCAST_INDEX_API_SECRET }}"
          PODCAST_USER_AGENT="${{ secrets.PODCAST_USER_AGENT }}"
          FYYD_ACCESS_TOKEN="${{ secrets.FYYD_ACCESS_TOKEN }}"
          PAYPAL_URL="${{ secrets.PAYPAL_URL }}"
          DONATE_WITH_KOFI_URL="${{ secrets.DONATE_WITH_KOFI_URL }}"
          DISCORD_URL="${{ secrets.DISCORD_URL }}"
          URL_GITHUB_ISSUES="${{ secrets.URL_GITHUB_ISSUES }}"
          URL_GITHUB_DISCUSSION="${{ secrets.URL_GITHUB_DISCUSSION }}"
          PRIVACY_POLICY="${{ secrets.PRIVACY_POLICY }}"
          URL_GITHUB="${{ secrets.URL_GITHUB }}"
          TERMS_OF_SERVICE="${{ secrets.TERMS_OF_SERVICE }}"
          EOF
          dart run build_runner build --delete-conflicting-outputs
      - run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build appbundle --release --android-skip-build-dependency-validation
      - name: Rename Artifacts for Clear Branding
        run: |
          cp "build/app/outputs/flutter-apk/app-release.apk" "openair-${{ needs.create_release.outputs.version }}-android.apk"
          cp "build/app/outputs/bundle/release/app-release.aab" "openair-${{ needs.create_release.outputs.version }}-android.aab"
      - name: Upload Releases
        run: |
          gh release upload --clobber "${{ needs.create_release.outputs.version }}" \
            openair-${{ needs.create_release.outputs.version }}-android.apk \
            openair-${{ needs.create_release.outputs.version }}-android.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release:
    needs: [create_release, build_linux_tarball, build_appimage, build_windows, build_macos, build_android]
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish draft release
        run: |
          gh release edit "${{ needs.create_release.outputs.version }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    needs: [create_release, build_windows, publish_release]
    name: winget (Windows package manager)
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Publish to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: OpenAir-Podcast.OpenAir
          installers-regex: 'windows-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ needs.create_release.outputs.version }}

